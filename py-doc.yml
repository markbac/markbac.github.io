      - content/guidelines/principles-catalogue.md
      - content/guidelines/business-principles.md
      - content/guidelines/organisation-adoption.md
      - content/guidelines/personal-projects.md
      - content/guidelines/agent-rules.md
      - content/guidelines/checklists.md
    outputs: {docx: {}, pdf: {}}

  standards:
    # Standards. The section's own pull request lists the rest of its files here.
    sources:
      - content/standards/index.md
    outputs: {docx: {}, pdf: {}}

  guides:
    # Guides. The section's own pull request lists the rest of its files here.
