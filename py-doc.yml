lint:
  exclude: [build, site/build, site/build-tarf]
  acronyms:
    allowed: [MISRA, LwM2M, IoT, API, CBOR, ADR, RFC, HLD, ARB]   # well known in this field; sections add theirs
  vale:
    enabled: auto
    spelling: en-GB

site:
  engine: mkdocs
  dir: site
  # Only the sections that have moved in are published. Add each section here when its pull request
  # merges; until then its placeholder page stays off both sites.
  documents: [guidelines, primers, glossary, templates]
  downloads: [pdf, docx]
  targets:
    github: mkdocs.yml        # https://markbac.github.io/, personal home page
    tarf: mkdocs.tarf.yml     # https://tarf.co.uk/, the tarf home page
  pages:                      # pages of our own, after the sections in the navigation
    Blog: blog/index.md
