# The source of https://markbac.github.io/ and https://tarf.co.uk/.
# Each section of the sites is a py-doc document under content/. `py-doc build` makes its Word and PDF
# files, and `py-doc site build` publishes every section to both sites (site.targets).

project:
  name: tarf.co.uk

outputs:
  docx: {dir: build}
  pdf: {dir: build}

# One document per section, in the order of the navigation. Each section's pull request fills in its
# own sources and leaves the other sections alone. The blog is not a py-doc document: its posts live
# in site/docs/blog/ for MkDocs Material's blog plugin.
documents:
  guidelines:
    # Guidelines. The section's own pull request lists the rest of its files here.
    sources:
      - content/guidelines/index.md
    outputs: {docx: {}, pdf: {}}

  standards:
    # Standards. The section's own pull request lists the rest of its files here.
    sources:
      - content/standards/index.md
    outputs: {docx: {}, pdf: {}}

  guides:
    # Guides. The section's own pull request lists the rest of its files here.
    sources:
      - content/guides/index.md
    outputs: {docx: {}, pdf: {}}

  handbook:
    # Architecture Handbook. The section's own pull request lists the rest of its files here.
    sources:
      - content/handbook/index.md
    outputs: {docx: {}, pdf: {}}

  primers:
    # Primers. The section's own pull request lists the rest of its files here.
    sources:
      - content/primers/index.md
    outputs: {docx: {}, pdf: {}}

  reference:
    # Reference. The section's own pull request lists the rest of its files here.
    sources:
      - content/reference/index.md
    outputs: {docx: {}, pdf: {}}

  glossary:
    # Glossary: the index, then one file per letter group. Each term is a ### heading, so it has
    # its own anchor (content/glossary/redirects.tsv maps the old one-page-per-term URLs to them).
    sources:
      - content/glossary/index.md
      - content/glossary/a-c.md
      - content/glossary/d-f.md
      - content/glossary/g-k.md
      - content/glossary/l-n.md
      - content/glossary/o-r.md
      - content/glossary/s-z.md
    outputs: {docx: {}, pdf: {}}

  templates:
    # Templates & Checklists. The section's own pull request lists the rest of its files here.
    sources:
      - content/templates/index.md
    outputs: {docx: {}, pdf: {}}

  radar:
    # Tech Radar. The section's own pull request lists the rest of its files here.
    sources:
      - content/radar/index.md
    outputs: {docx: {}, pdf: {}}

  firmitas:
    # Firmitas. The section's own pull request lists the rest of its files here.
    sources:
      - content/firmitas/index.md
    outputs: {docx: {}, pdf: {}}


lint:
  exclude: [build, site/build, site/build-tarf]
  acronyms:
    allowed: [MISRA, LwM2M, IoT, API, CBOR, ADR, RFC, HLD, ARB]   # well known in this field; sections add theirs
  vale:
    enabled: auto
    spelling: en-GB

site:
  engine: mkdocs
  dir: site
  downloads: [pdf, docx]
  targets:
    github: mkdocs.yml        # https://markbac.github.io/, personal home page
    tarf: mkdocs.tarf.yml     # https://tarf.co.uk/, the tarf home page
  pages:                      # pages of our own, after the sections in the navigation
    Blog: blog/index.md
