# The source of https://markbac.github.io/ and https://tarf.co.uk/.
# Each section of the sites is a py-doc document under content/. `py-doc build` makes its Word and PDF
# files, and `py-doc site build` publishes every section to both sites (site.targets).

project:
  name: tarf.co.uk

outputs:
  docx: {dir: build}
  pdf: {dir: build}

# One document per section, in the order of the navigation. Each section's pull request fills in its
# own sources and leaves the other sections alone. The blog is not a py-doc document: its posts live
# in site/docs/blog/ for MkDocs Material's blog plugin.
documents:
  guidelines:
    # Guidelines (from EngineeringProcess): the overview and core rules, the 26 guidelines in number order,
    # then the principles, adoption, personal-project, agent and checklist pages.
    sources:
      - content/guidelines/index.md
      - content/guidelines/core-rules.md
      - content/guidelines/guidelines-governance.md
      - content/guidelines/values-and-ways-of-working.md
