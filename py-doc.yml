      - content/guidelines/interfaces-and-co-design.md
      - content/guidelines/components-reuse-and-variants.md
      - content/guidelines/technology-and-third-party.md
      - content/guidelines/coding-principles.md
      - content/guidelines/coding-standard.md
      - content/guidelines/version-control-and-versioning.md
      - content/guidelines/pull-requests-and-review.md
      - content/guidelines/pipelines-and-quality-gates.md
