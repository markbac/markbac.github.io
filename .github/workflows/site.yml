name: Site

# Lint, build the Word and PDF files, and build both sites. On main, publish https://markbac.github.io/
# with GitHub Pages, and (once the TARF_DEPLOY variable is true) push the tarf.co.uk build to
# markbac/web-content, which tarf.co.uk's host pulls by webhook.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # version: git and the "last updated" dates need the history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install py-doc
        run: python -m pip install "py-doc @ git+https://github.com/markbac/py-doc"
      - name: Install Vale (py-doc lint runs it as well as its own rules)
        run: curl -fsSL https://github.com/errata-ai/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz | sudo tar -xz -C /usr/local/bin vale
      - name: Build the tool image (pandoc, diagrams, MkDocs)
        run: py-doc tools build
      - name: Lint
        run: py-doc lint content site/docs/blog --format github
      - name: Word and PDF files
        run: py-doc build --keep-going
      - name: Both sites
        run: py-doc site build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build
      - uses: actions/upload-artifact@v4
        with:
          name: tarf
          path: site/build-tarf

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  tarf:
    # Off until the switch-over: set the repository variable TARF_DEPLOY to true, and add a
    # WEB_CONTENT_TOKEN secret (a fine-grained token with contents: write on markbac/web-content).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.TARF_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarf
          path: tarf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: markbac/web-content
          token: ${{ secrets.WEB_CONTENT_TOKEN }}
          path: web-content
      - name: Replace the site, keeping the files tarf.co.uk serves that are not built here
        run: |
          rsync -a --delete \
            --exclude .git --exclude '.htaccess' --exclude ' htaccess' --exclude 'robots.txt' \
            --exclude 'logo/' --exclude 'ali/' --exclude 'arlo/' --exclude 'mark/' --exclude 'rowan/' \
            --exclude LICENSE --exclude README.md \
            tarf/ web-content/
          cd web-content
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish tarf.co.uk from markbac.github.io@${GITHUB_SHA::7}"
          git push
