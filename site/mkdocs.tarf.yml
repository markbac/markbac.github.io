# https://tarf.co.uk/ : the same pages as mkdocs.yml, with tarf's name, address and home page.
INHERIT: mkdocs.yml
site_name: tarf.co.uk
site_url: https://tarf.co.uk/
site_description: A resource hub for software architecture, technology and engineering
site_dir: build-tarf
copyright: "&copy; tarf.co.uk"

extra:
  home: tarf          # overrides/home.html shows the tarf home page

# The parent's plugins, repeated because a child config replaces the list rather than merging it,
# with redirects for the old tarf.co.uk pages: the glossary (from content/glossary/redirects.tsv) and
# the old 101s, Architecture Handbook, Tech Radar and Templates pages. Written by the switch-over;
# Reference is not here because web-content keeps serving it.
