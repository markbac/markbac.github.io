hooks:
  - hooks/all_posts.py   # fills blog/all-posts.md with every post

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences:
      # Blog posts are not py-doc pages, so their Mermaid blocks are drawn in the browser.
      # (py-doc draws the sections' diagrams as SVG before MkDocs sees them.)
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.arithmatex: {generic: true}

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/markbac
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/mdbacon/
