# https://markbac.github.io/ . py-doc writes the section pages (docs/<section>/) and py-doc-nav.yml.
# mkdocs.tarf.yml inherits this file and changes only the address and the home page.
INHERIT: py-doc-nav.yml
site_name: Mark Bacon
site_url: https://markbac.github.io/
site_author: Mark Bacon
site_description: Software and IoT architecture notes, guidelines, reference and blog
repo_url: https://github.com/markbac/markbac.github.io
copyright: "&copy; Mark Bacon"
docs_dir: docs
site_dir: build
# MkDocs always leaves out a top-level templates/ folder (as well as dot files), and that folder is
# the Templates & Checklists section here, so take it back in.
exclude_docs: |
  !/templates/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo/logo-transparent.png
  favicon: assets/logo/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: long
      post_url_format: "{slug}"   # no dates in the addresses
      archive: false               # no archive by date
  - redirects:
      # Old addresses keep working. Pages that moved into groups in the navigation, and the blog's old
      # dated addresses and date archive, which the blog no longer uses. tarf's are in mkdocs.tarf.yml.
