# https://markbac.github.io/ . py-doc writes the section pages (docs/<section>/) and py-doc-nav.yml.
# mkdocs.tarf.yml inherits this file and changes only the address and the home page.
INHERIT: py-doc-nav.yml
site_name: Mark Bacon
site_url: https://markbac.github.io/
site_author: Mark Bacon
site_description: Software and IoT architecture notes, guidelines, reference and blog
repo_url: https://github.com/markbac/markbac.github.io
copyright: "&copy; Mark Bacon. Content under the MIT licence unless a section says otherwise"
docs_dir: docs
site_dir: build
# MkDocs always leaves out a top-level templates/ folder (as well as dot files), and that folder is
# the Templates & Checklists section here, so take it back in.
exclude_docs: |
  !/templates/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo/logo-transparent.png
  favicon: assets/logo/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: long
  - redirects:
      # Old addresses keep working. tarf's are case-sensitive paths on its host.
      redirect_maps: {}

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences:
      # Blog posts are not py-doc pages, so their Mermaid blocks are drawn in the browser.
      # (py-doc draws the sections' diagrams as SVG before MkDocs sees them.)
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.arithmatex: {generic: true}

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/markbac
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/mdbacon/
